<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>plan3d</title>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="empty" hidden>Tap <b>Scan room</b> and walk around the room with your phone.</div>
<div id="info" class="chip" hidden></div>

<button id="menuBtn" class="round" aria-label="Menu">⋯</button>
<div id="tools">
  <button id="tool-wall" class="round" title="Add a wall" aria-label="Add a wall"><svg viewBox="0 0 24 24"><path d="M5 19 19 5" stroke-width="3.5"/><circle cx="5" cy="19" r="2.2" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="2.2" fill="currentColor" stroke="none"/></svg></button>
  <button id="tool-door" class="round" title="Add a door" aria-label="Add a door"><svg viewBox="0 0 24 24"><path d="M2 20h4M20 20h2" stroke-width="3"/><path d="M6 20V6" stroke-width="2.2"/><path d="M6 6a14 14 0 0 1 14 14" stroke-dasharray="2 2.2"/></svg></button>
  <button id="tool-window" class="round" title="Add a window" aria-label="Add a window"><svg viewBox="0 0 24 24"><path d="M1 12h3M20 12h3" stroke-width="3"/><rect x="4" y="9" width="16" height="6"/><path d="M4 12h16"/></svg></button>
  <button id="tool-part" class="round" title="Mark a part of a wall to remove or build" aria-label="Mark a part of a wall"><svg viewBox="0 0 24 24"><path d="M1 12h5M18 12h5" stroke-width="3"/><rect x="6" y="9" width="12" height="6"/><path d="M8 15l4-6M12 15l4-6"/></svg></button>
  <button id="tool-stair" class="round" title="Add stairs" aria-label="Add stairs"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20"/><path d="M5 6h14M5 10h14M5 14h14M5 18h14"/></svg></button>
  <button id="undo" class="round" title="Undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button id="redo" class="round" title="Redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
</div>
<nav id="menu" hidden>
  <button id="rename" class="name"><span></span><span aria-hidden="true">✎</span></button>
  <button id="square">Square all corners</button>
  <button id="fit">Fit to screen</button>
  <button id="export">Export plan (SVG)</button>
  <button id="exportJson">Export plan (JSON)</button>
  <button id="import">Import plan</button>
  <button id="driveSave" hidden>Save to Google Drive</button>
  <button id="driveLoad" hidden>Load from Google Drive</button>
  <button id="scanData" hidden>Download last scan data</button>
  <button id="clear" class="danger">Clear plan</button>
  <a href="depth.html">Depth test page</a>
  <a href="privacy.html">Privacy policy</a>
</nav>
<input id="file" type="file" accept=".svg,.json,image/svg+xml,application/json" hidden>

<p id="scanMsg" class="chip warn" hidden></p>
<button id="scan" class="primary fab">Scan room</button>

<section id="sheet" hidden></section>

<div id="scanOverlay">
  <canvas id="arDraw"></canvas>
  <div id="hud"></div>
  <div id="cross"></div>
  <div id="aimText"></div>
  <canvas id="map" width="200" height="200"></canvas>
  <div id="marks">
    <button id="markCorner">Corner</button>
    <button id="markDoor">Door</button>
    <button id="markWindow">Window</button>
    <button id="markStair">Stairs</button>
    <button id="markRemove">Undo</button>
  </div>
  <div id="bar">
    <button id="cancel" class="secondary">Cancel</button>
    <button id="finish">Finish</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
